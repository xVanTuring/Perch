name: Perch
options:
  bundleIdPrefix: tech.xvanturing
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  # 3.1.0 起才修好 macOS 26/27 上录制框的清除按钮(上游 issue #241:
  # 事件监视器吞掉了框内的 mouseUp,NSSearchField 的 × 永远触发不了)。
  # 别退回 2.x。
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "3.1.0"
  # Sparkle 2 自动更新框架。装好后:
  #   - `Sources/Perch/Features/Updater/UpdaterService.swift` 用
  #     `SPUStandardUpdaterController` 驱动整条更新流程(拉 appcast、
  #     EdDSA 校验、下载、out-of-process 安装、重启)。
  #   - `scripts/release.sh` 用 SPM artifact 里的 `sign_update` 工具
  #     给每个 release 的 zip 签 EdDSA,把 `<item>` 插进 appcast.xml。
  #   - Perch **不在 sandbox**,所以省掉了 Installer XPC service +
  #     `-spks`/`-spki` mach-lookup entitlements,集成比 sandboxed App
  #     简单不少。
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.9.1"
  # WYSIWYG Markdown 引擎(上游 nodes-app/swift-markdown-engine)—— 全 app 唯一的
  # 便签编辑器后端。上游有 semver tag,这里锁定确切版本:0.x 阶段小版本甚至补丁
  # 版本都可能带破坏性变更(见其 CHANGELOG.md),升级前先读,不要放宽成 from。三个 product:
  #   - MarkdownEngine          核心 TextKit2 编辑器(零外部依赖)
  #   - MarkdownEngineCodeBlocks  HighlighterSwift 代码高亮 turnkey bridge
  #   - MarkdownEngineLatex       SwiftMath LaTeX turnkey bridge
  # 后两者把 HighlighterSwift / SwiftMath 作为传递依赖带进来。
  #
  # ⚠️ 暂时指向 fork,不是上游。上游 0.13.0 把图片引用的 UUID 藏在 `.wikiLinkID`
  # 文本属性上,正文里只留 `![[名称]]`。那个属性只在这段文字还能解析成 embed 时
  # 才活着 —— 删一个括号、整段改名、复制这一行,UUID 就没了,而且找不回来:图片
  # 还在 Core Data 里,但没有任何东西叫得出它。
  # fork 的修复(上游 PR #185、#186,还没合并):
  #   - 修了三条会丢 UUID 的编辑路径(名字开头插字符 / 整段改名 / 复制剪切)
  #   - 加了 `ImageEmbedStyle.keepsIDInSource`,把 UUID 留在正文里,从根上去掉
  #     这个旁路通道(Perch 在 MarkdownEngineNoteEditor 里打开了它)
  #   - 粘贴的链接直接显示成展示形式;开了 keepsIDInSource 时图片 embed 粘贴后原样保留 UUID
  # 2026-10-11 起用 fork 的 `xvan` 分支(和 UniReader 共用,原 perch/wikilink-id-survival
  # 分支不再更新):上游 main(0.14.0 之后 3 个提交)+ 上面的修复 + UniReader 的行内公式 /
  # 代码块选区 / SwiftMath 断言修复。跑通上游全部测试和 fork 新增的测试。
  # 0.14.0-xvan.2 在此之上加了两个可关的编辑开关(Perch 接到 Settings → 便签):
  #   - `ListStyle.autoSpaceTaskCheckbox`(默认开):在列表标记后打 `[` 直接补成 `- [ ] `,
  #     光标落在空格后(xvan.4 起一个键就够;auto-close pairs 关掉时才还要补 `]`)。
  #   - `MarkdownEditorConfiguration.editsTablesInPlace`(默认开):点表格单元格原地编辑
  #     它的 Markdown,表格保持渲染;Tab / 方向键换格、Esc 退出。
  #     这两个字段 wrapper 的 updateNSView 现在都会同步进 textView,翻开关立刻生效。
  #     (xvan.2 / xvan.3 时 `editsTablesInPlace` 不同步,Perch 用 `.id` 重建编辑器顶了
  #     一阵;xvan.4 补上了同步,那个 workaround 已删。)
  # 0.14.0-xvan.3 把表格的右键菜单交给使用方:引擎不再带菜单,也不再带那套 en/zh-Hans
  # 资源 —— 模块内的资源包是按**宿主 App** 的本地化解析的,而 Perch.app 没有任何 .lproj,
  # 所以引擎自己出的标题永远解析成英文,跟不了 Perch 自己的语言设置。现在单元格里右键走
  # `onTableCellContextMenu` 钩子,拿 `TableCellMenuContext` 自己建菜单;Perch 的 13 个
  # 动作标题在 `Features/Notes/TableEditMenu.swift`,用 `L.t` 出语言。
  # 0.14.0-xvan.4 修了三处:上面那条 `editsTablesInPlace` 的运行时同步;单元格里打字不再
  # 闪一下换行(先把编辑器横向撑开,写回文档后才让列变宽);宽表格内部滚动时单元格编辑器
  # 跟着滚。顺带把 auto-close pairs 做全了(受 `autoClosePairsEnabled` 管,Perch 没关):
  # 手动打右括号会跳过已有的那个,选中文字后打左括号或 Markdown 标记
  # (`( [ { = * _ ~ ` $`)会把选区包起来并保持选中,再打一次就套两层。
  # 0.14.0-xvan.5 把「智能引号」默认关掉(`SpellCheckingPolicy.automaticQuoteSubstitution`
  # = false):Markdown 源码要直引号,打 `'` `"` 不再被换成弯引号。Perch 用的就是引擎默认值
  # (没在别处覆盖),升级即生效。另外 `"` `'` 也进了 xvan.4 那套「选中文字后打标记包起来」
  # 的集合。
  # 按 revision 锁 commit,不按 tag —— tag 可移动,这里要的是可复现。
  # 上游合并或发新版后应尽快切回 url: https://github.com/nodes-app/swift-markdown-engine
  MarkdownEngine:
    url: https://github.com/xVanTuring/swift-markdown-engine
    revision: "85435e489e30f658df4751f33b5aa101990546e8"   # tag 0.14.0-xvan.5

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    PRODUCT_NAME: Perch
    # Hardened Runtime 是 Developer ID 公证的硬性要求(notarytool 拒绝未启用的 .app)。
    # 也是 dev 阶段就开,免得 release 时再排查 unentitled framework 之类的兼容性问题。
    ENABLE_HARDENED_RUNTIME: YES
    # T8F5T6HKG8 = "Shenzhen Zhiqishidai Technology" 企业账号。
    # ⚠️ CloudKit container `iCloud.tech.xvanturing.Perch` 需要在该 team 的
    #    Apple Developer portal(https://developer.apple.com/account/resources/identifiers/list/cloudContainer)
    #    下手动创建,Identifier 完全一致;App ID `tech.xvanturing.Perch` 也要
    #    在同一 team 注册并勾上 iCloud + Push Notifications capability。
    DEVELOPMENT_TEAM: T8F5T6HKG8
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    Debug:
      # 开发期 Apple Development 自动签名,entitlements 走 development APS
      # (CloudKit Dev 环境)。
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      # Release **build 阶段**也用 Apple Development 自动签名 —— 这只是为了让
      # archive 能编译过。真正的 Developer ID 签名在 release.sh 的
      # `xcodebuild -exportArchive` 阶段做,通过 ExportOptions.plist 指定
      # method=developer-id,Xcode 会自动 fetch Developer ID profile 并重签。
      # 这是 Apple canonical 的 Direct Distribution 流程。
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      # --timestamp:RFC 3161 时间戳,公证强制要求。Release 阶段 export 时由
      # ExportOptions.plist 的 signingOptions 接管,这里加上保险一层。
      OTHER_CODE_SIGN_FLAGS: "--timestamp"

targets:
  Perch:
    type: application
    platform: macOS
    sources:
      - path: Sources/Perch
        excludes:
          - "Resources/**"
      # Resources/** 整体排除是因为 Info.plist / entitlements 由 info.path 和
      # CODE_SIGN_ENTITLEMENTS 单独 wire,不能再走 Sources。AppIcon 的资产目录
      # 必须手动加回来,否则 Xcode 编译时找不到 CFBundleIconName 指向的资源。
      - Sources/Perch/Resources/Assets.xcassets
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
        product: Sparkle
      - package: MarkdownEngine
        product: MarkdownEngine
      - package: MarkdownEngine
        product: MarkdownEngineCodeBlocks
      - package: MarkdownEngine
        product: MarkdownEngineLatex
    # 显式声明 scheme(以前靠 Xcode 自动生成):一旦有共享 scheme,Xcode 就不再自动
    # 生成,release.sh 用的 `-scheme Perch` 会找不到。测试挂在 Test 动作上:
    # `xcodebuild -scheme Perch test`。
    scheme:
      testTargets:
        - PerchSyncTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.Perch
      configs:
        # Debug 用开发环境 entitlements(aps-environment=development → CloudKit Dev)。
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/Perch/Resources/Perch.entitlements
        # Release 用 production entitlements(aps-environment=production → CloudKit Prod)。
        # 部署 schema 到 Production 见 CLAUDE.md "Schema → CloudKit deployment workflow"。
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/Perch/Resources/Perch-Release.entitlements
    info:
      path: Sources/Perch/Resources/Info.plist
      properties:
        CFBundleName: Perch
        CFBundleDisplayName: Perch
        CFBundleShortVersionString: "2.9.0"
        CFBundleVersion: "28"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "15.0"
        # 应用分类(便签 = 效率工具)。消除打包时 "No App Category is set" 警告,
        # 也是 Finder / App Store 元数据。等价于 Xcode General 标签里的 Category。
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 xVanTuring"
        NSPrincipalClass: NSApplication
        CFBundleIconName: AppIcon
        # ── Sparkle 2 自动更新 ──────────────────────────────────────
        # Appcast feed 托管在 GitHub repo 的 main 分支:每次 release.sh
        # 跑完会 commit + push 更新后的 appcast.xml。Sparkle 默认从
        # raw.githubusercontent.com 这个 URL 拉取。
        SUFeedURL: "https://raw.githubusercontent.com/xVanTuring/Perch/main/appcast.xml"
        # 默认定期检查间隔(秒)。用户在 Settings → Updates 改了之后,Sparkle
        # 把新值持久化到自己的 defaults domain,这里只是首次安装的初值(每天)。
        SUScheduledCheckInterval: 86400
        # EdDSA 公钥 —— Sparkle 用它校验下载的 zip 签名;私钥由发布机的
        # login keychain(`https://sparkle-project.org` item)持有,由
        # release.sh 调 `sign_update` 时读取。生成步骤见 docs/release.md。
        # ⚠️ 首次发布前必须填上,否则 release.sh preflight 会拒绝运行。
        # 一旦发布后**严禁**更换公钥,否则已装版本会拒绝所有未来更新。
        SUPublicEDKey: "g3SCjADYsXhMN5/4hnQZ7eOawvtVoGJJsS5CFew15WQ="

  # 同步核心(Sources/Perch/Sync/Core)的单元测试。不挂在 App 上(没有 TEST_HOST),
  # 直接把那几个纯逻辑文件编进测试包 —— 跑测试不会启动整个 Perch(菜单栏、MCP 服务、
  # 浮窗)。所以 Sync/Core 里的文件只能依赖 Foundation / CryptoKit,不能引用 App 的类型。
  PerchSyncTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PerchSyncTests
      - Sources/Perch/Sync/Core
    settings:
      base:
        PRODUCT_NAME: PerchSyncTests
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.PerchSyncTests
        GENERATE_INFOPLIST_FILE: YES
